name: Nexus Photo Studio - Windows Alpha

# Ein Windows-Build startet nur auf ausdrückliche Anfrage durch Änderung
# von .nexus-build-request. Keine Benachrichtigungsflut bei regulären Code-Änderungen.
on:
  push:
    branches:
      - nexus/alpha-trickkiste
    paths:
      - .nexus-build-request
  workflow_dispatch:

concurrency:
  group: nexus-alpha-06
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-alpha:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install current Rust toolchain
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Generate original Nexus artwork
        shell: pwsh
        run: |
          python tools/generate_nexus_icons.py .
          if ($LASTEXITCODE -ne 0) { throw "Nexus icons could not be generated" }
          if (-not (Test-Path assets/app-icon/photocraft.ico)) { throw "Missing Windows app icon" }

      - name: Verify Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "Rust formatting failed" }

      - name: Build photo editor for Windows
        shell: pwsh
        run: |
          $env:PHOTOCRAFT_REQUIRE_WINRES = '1'
          cargo build --release --locked -p photocraft
          if ($LASTEXITCODE -ne 0) { throw "Rust Windows build failed" }
          if (-not (Test-Path target/release/photocraft.exe)) { throw "No application executable found" }
          python tools/verify_nexus_exe_icon.py target/release/photocraft.exe assets/app-icon/photocraft.ico
          if ($LASTEXITCODE -ne 0) { throw "Built EXE does not contain the Nexus icon" }

      - name: Nexus favorites regression test
        shell: pwsh
        run: |
          cargo test --locked -p photocraft-ui-egui --lib favorites_toggle_and_ignore_unknown_saved_filters
          if ($LASTEXITCODE -ne 0) { throw "Gallery favorites test failed" }

      - name: Targeted upstream regression tests
        shell: pwsh
        run: |
          cargo test --locked -p photocraft-io --lib psb_writes_long_length_blocks_as_8b64
          if ($LASTEXITCODE -ne 0) { throw "PSB save regression test failed" }
          cargo test --locked -p photocraft-engine --lib shortcuts_normalise_and_detect_conflicts
          if ($LASTEXITCODE -ne 0) { throw "Shortcut normalisation regression test failed" }
          cargo test --locked -p photocraft-ui-egui --lib page_and_arrow_keys_recorded_in_the_editor_fire
          if ($LASTEXITCODE -ne 0) { throw "Keyboard shortcut regression test failed" }

      - name: Prepare portable alpha with licenses
        shell: pwsh
        run: |
          # A new folder path avoids Explorer showing an old cached/pinned icon.
          $folder = 'dist/nexus/NexusPhotoStudio-0.6-alpha-portable'
          New-Item -ItemType Directory -Path "$folder/Lizenzen" -Force | Out-Null
          Copy-Item target/release/photocraft.exe "$folder/NexusPhotoStudio.exe"
          New-Item -ItemType File -Path "$folder/portable.txt" -Force | Out-Null
          foreach ($file in @('LICENSE-MIT','LICENSE-APACHE','NOTICE','ATTRIBUTION.md')) {
            Copy-Item $file "$folder/Lizenzen"
          }
          foreach ($file in @('assets/fonts/OFL-Inter.txt','assets/fonts/OFL-JetBrainsMono.txt',
              'assets/icons/LICENSE-lucide.txt','assets/dict/LICENSE-SCOWL.txt',
              'crates/algo/data/LICENSE-libfacedetection.txt')) {
            if (Test-Path $file) {
              Copy-Item $file "$folder/Lizenzen"
            }
          }
          Copy-Item docs/NEXUS_DEVELOPMENT.md "$folder/ENTWICKLUNG.md"
          @(
            'Nexus Photo Studio 0.6 Alpha - portable Windows test version',
            'Start NexusPhotoStudio.exe from THIS new versioned folder.',
            'If an old taskbar icon persists, unpin its shortcut and pin the new EXE.',
            'Windows may cache icons by shortcut and executable path.',
            'Open-source attribution and license notices are in Lizenzen/.'
          ) | Set-Content "$folder/START-HIER.txt" -Encoding UTF8
          # Preserve the versioned top-level folder inside ZIP.
          Compress-Archive -Path "$folder" -DestinationPath 'dist/nexus/NexusPhotoStudio-0.6-alpha-win64-portable.zip' -Force

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Create Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc packaging/nexus/NexusPhotoStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }

      - name: Upload alpha builds for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: NexusPhotoStudio-v0.6-alpha-Windows
          path: |
            dist/nexus/*win64-portable.zip
            dist/nexus/*win64-setup.exe
          if-no-files-found: error
          retention-days: 14
